<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#263346"/>
      <stop offset="50%" stop-color="#151D28"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="25%" y1="10%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="bellyGlow" cx="62%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="dropClip">
      <path d="M128,42 C164,95 188,130 188,158 C188,192 161,218 128,218 C95,218 68,192 68,158 C68,130 92,95 128,42 Z"/>
    </clipPath>
  </defs>
  <!-- 8-Tooth Industrial Gear Outer Body -->
  <path fill="url(#gearGrad)" stroke="#334155" stroke-width="3" stroke-linejoin="round"
    d="M114,12 H142 L148,32 A96,96 0 0,1 172,42 L191,29 L211,49 L198,68 A96,96 0 0,1 208,92 L228,98 V126 L208,132 A96,96 0 0,1 198,156 L211,175 L191,195 L172,182 A96,96 0 0,1 148,192 L142,212 H114 L108,192 A96,96 0 0,1 84,182 L65,195 L45,175 L58,156 A96,96 0 0,1 48,132 L28,126 V98 L48,92 A96,96 0 0,1 58,68 L45,49 L65,29 L84,42 A96,96 0 0,1 108,32 Z"
    transform="translate(0, 16)"/>
  <!-- Metallic Gold Inner Ring & Dark Well -->
  <circle cx="128" cy="128" r="86" fill="#0F172A" stroke="url(#ringGrad)" stroke-width="7"/>
  <!-- Luminous Golden-Amber Oil Drop -->
  <g clip-path="url(#dropClip)">
    <path d="M128,42 C164,95 188,130 188,158 C188,192 161,218 128,218 C95,218 68,192 68,158 C68,130 92,95 128,42 Z" fill="url(#dropGrad)"/>
    <path d="M128,42 C164,95 188,130 188,158 C188,192 161,218 128,218 C95,218 68,192 68,158 C68,130 92,95 128,42 Z" fill="url(#bellyGlow)"/>
    <!-- Crisp Clipped Specular Highlight -->
    <ellipse cx="104" cy="134" rx="14" ry="34" transform="rotate(-20 104 134)" fill="#FFFFFF" fill-opacity="0.72"/>
    <ellipse cx="146" cy="190" rx="11" ry="6" transform="rotate(-15 146 190)" fill="#FEF9C3" fill-opacity="0.55"/>
  </g>
